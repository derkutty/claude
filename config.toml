# Einstellungen für den automatischen Shorts-Kanal.
# Alles hier kann ohne Code-Änderung angepasst werden.

[channel]
# Worum geht es im Kanal? Je enger die Nische, desto besser lernt der Algorithmus,
# wem er die Videos zeigen soll.
niche = "Verblüffende Fakten über Psychologie, den menschlichen Körper und die Natur"
# Sprache der Videos (Skript, Titel, Beschreibung).
language = "Deutsch"
# Zielgruppe in einem Satz – hilft beim Ton.
audience = "Neugierige 16- bis 35-Jährige, die beim Scrollen hängen bleiben wollen"
# Feste Hashtags, die an jede Beschreibung angehängt werden.
hashtags = ["#shorts", "#fakten", "#wissen"]

[script]
# Ziel-Länge in Sekunden. 25–40 s funktioniert für Fakten-Shorts am besten.
target_seconds = 35
# Wie viele frühere Videos (beste und schlechteste nach Aufrufen) Claude als
# Feedback bekommt, damit die nächsten Ideen besser werden.
feedback_videos = 5

[voice]
# Kostenlose Microsoft-Edge-Stimmen. Liste: `edge-tts --list-voices`
# Deutsche Beispiele: de-DE-ConradNeural, de-DE-KatjaNeural, de-DE-FlorianMultilingualNeural
name = "de-DE-ConradNeural"
# Etwas schneller als normal wirkt bei Shorts energischer.
rate = "+12%"

[video]
width = 1080
height = 1920
fps = 30
# Schriftart für die Untertitel. Eigene .ttf/.otf-Dateien in assets/fonts/ legen
# und hier den Schriftnamen eintragen (z. B. "Montserrat ExtraBold").
font = "DejaVu Sans"
font_size = 92
# Wie viele Wörter gleichzeitig eingeblendet werden.
words_per_caption = 2
# Hintergrundmusik: beliebige lizenzfreie .mp3-Dateien in assets/music/ legen.
# Pro Video wird zufällig eine gewählt. Lautstärke relativ zur Stimme.
music_volume = 0.10

[upload]
# "public", "unlisted" oder "private".
privacy = "public"
# YouTube-Kategorie: 27 = Bildung, 24 = Unterhaltung, 28 = Wissenschaft & Technik
category_id = "27"
# Sprache als BCP-47-Code für YouTube.
language_code = "de"
# Kennzeichnung "verändert oder synthetisch erzeugt". YouTube verlangt das für
# realistisch wirkende KI-Inhalte; eine KI-Stimme über echten Stock-Clips
# fällt normalerweise nicht darunter. Im Zweifel auf true setzen.
contains_synthetic_media = false
