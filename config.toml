# Einstellungen für den automatischen Shorts-Kanal.
# Alles hier kann ohne Code-Änderung angepasst werden.

[channel]
# Sprache der Videos (Skript, Titel, Beschreibung).
language = "Deutsch"
# Zielgruppe in einem Satz – hilft beim Ton.
audience = "Neugierige 14- bis 35-Jährige, die beim Scrollen gern miträtseln und Neues lernen"
# Hashtags, die an jede Beschreibung angehängt werden (plus die des jeweiligen Formats).
hashtags = ["#shorts"]

[experiment]
# Diese Formate werden gegeneinander getestet. Wenn du dich festgelegt hast,
# trag nur noch eins ein, z. B. formats = ["quiz"].
# "fakten" braucht zusätzlich einen Pexels-Schlüssel (PEXELS_API_KEY); erst dann hier ergänzen.
formats = ["laender", "quiz", "emoji"]
# So viele Videos pro Format müssen 3 Tage online sein, bevor ausgewertet wird.
# Bei 2 Videos am Tag und 3 Formaten dauert die Testphase damit etwa 2 Wochen.
min_videos_per_format = 6
# Nach der Testphase: Anteil der Uploads, der weiter die anderen Formate testet.
explore_share = 0.2

[formats.laender]
themes = "Alltag, Essen und Trinken, Schlaf, Arbeit und Urlaub, Gesundheit, Geld, Sprache, Bräuche und Feste"
# 4–6 Länder pro Video.
countries = 5
hashtags = ["#länder", "#vergleich", "#wusstestdu"]

[formats.quiz]
themes = "Allgemeinwissen: Tiere, Geografie, menschlicher Körper, Geschichte, Weltraum, Essen, Sprache"
questions = 3
countdown_seconds = 4
hashtags = ["#quiz", "#allgemeinwissen", "#rätsel"]

[formats.emoji]
themes = "Bekannte Filme, Disney-Filme, Serien, Märchen, deutsche Sprichwörter, Songs, Marken"
puzzles = 4
countdown_seconds = 4
hashtags = ["#emojichallenge", "#rätsel", "#errätstdues"]

[formats.fakten]
themes = "Verblüffende Fakten über Psychologie, den menschlichen Körper, Tiere und die Natur"
# Ziel-Länge in Sekunden. 25–40 s funktioniert für Fakten-Shorts am besten.
target_seconds = 35
hashtags = ["#fakten", "#wissen", "#wusstestdu"]

[voice]
# Kostenlose Microsoft-Edge-Stimmen. Liste: `edge-tts --list-voices`
# Die "Multilingual"-Stimmen klingen deutlich natürlicher als die älteren (z. B. de-DE-ConradNeural).
# Deutsch: de-DE-FlorianMultilingualNeural (männlich), de-DE-SeraphinaMultilingualNeural (weiblich)
name = "de-DE-FlorianMultilingualNeural"
# Falls die Stimme oben einmal nicht erreichbar ist, wird diese genommen.
fallback = "de-DE-ConradNeural"
# Etwas schneller als normal wirkt bei Shorts energischer; zu schnell klingt roboterhaft.
rate = "+6%"

[video]
width = 1080
height = 1920
fps = 30
# Schriftart. Eigene .ttf/.otf-Datei in assets/fonts/ legen und hier ihren Namen
# eintragen (z. B. "Montserrat ExtraBold").
font = "DejaVu Sans"
# Untertitel beim Fakten-Format.
font_size = 92
words_per_caption = 2
# Hintergrundmusik: lizenzfreie .mp3-Dateien in assets/music/ legen.
# Pro Video wird zufällig eine gewählt. Lautstärke relativ zur Stimme.
music_volume = 0.10

[upload]
# "public", "unlisted" oder "private".
privacy = "public"
# YouTube-Kategorie: 27 = Bildung, 24 = Unterhaltung, 28 = Wissenschaft & Technik
category_id = "27"
# Sprache als BCP-47-Code für YouTube.
language_code = "de"
# Kennzeichnung "verändert oder synthetisch erzeugt". YouTube verlangt das für
# realistisch wirkende KI-Inhalte; eine KI-Stimme über Grafiken oder echten
# Stock-Clips fällt normalerweise nicht darunter. Im Zweifel auf true setzen.
contains_synthetic_media = false
