name: Short posten

on:
  schedule:
    # Zeiten in UTC: 10:17 und 18:17 UTC = 11:17 und 19:17 Uhr deutscher Winterzeit.
    # GitHub startet geplante Läufe oft verspätet; eine geplante Claude-Aufgabe holt sie
    # 10 Minuten später nach, verspätete Läufe überspringen sich dann selbst.
    - cron: "17 10 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      no_upload:
        description: "Nur erzeugen, nicht hochladen (zum Testen)"
        type: boolean
        default: false
      format:
        description: "Format (automatisch = Format-Test entscheidet)"
        type: choice
        default: automatisch
        options: [automatisch, erklaert, laender, quiz, emoji]

permissions:
  contents: write

concurrency:
  group: post-short
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg und Schriften einrichten
        timeout-minutes: 10
        run: |
          # Bewusst ohne apt-get: Die Ubuntu-Paketserver sind manchmal so langsam, dass ein Lauf
          # scheitert. ffmpeg kommt als fertiges Programm von GitHub, die Schriften liegen im Repo.
          curl -sSfL --retry 4 --retry-delay 5 -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -hide_banner -version | head -1
          mkdir -p ~/.local/share/fonts
          cp assets/vendor-fonts/*.ttf assets/vendor-fonts/*.otf ~/.local/share/fonts/
          fc-cache -f > /dev/null
          fc-list | grep -ciE "inter|noto color emoji|dejavu"

      - run: pip install -r requirements.txt

      - name: Chromium für die animierten Formate installieren
        timeout-minutes: 10
        run: |
          python -m playwright install chromium
          # Die Systembibliotheken für Chromium sind auf GitHub-Runnern normalerweise schon da;
          # nur wenn der Start scheitert, werden sie (über die langsamen Paketserver) nachinstalliert.
          python -c "from playwright.sync_api import sync_playwright as p; b = p().start().chromium.launch(); b.close(); print('Chromium startet')" \
            || python -m playwright install-deps chromium

      - name: Short erzeugen und hochladen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m shorts.main ${{ inputs.no_upload && '--no-upload' || '' }} \
            ${{ inputs.format && inputs.format != 'automatisch' && format('--format {0}', inputs.format) || '' }}

      - name: Video zum Hochladen bereitlegen (GitHub-Release)
        if: hashFiles('build/release/tag.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$(cat build/release/tag.txt)" build/release/short.mp4 \
            --title "$(cat build/release/title.txt)" --notes-file build/release/notes.md

      - name: Video als Artefakt speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: |
            build/2*/short.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Verlauf speichern
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Verlauf aktualisieren"
          git pull --rebase
          git push
