name: Short posten

on:
  schedule:
    # Zeiten in UTC. 10:17 und 17:47 UTC = 12:17 und 19:47 Uhr deutscher Sommerzeit.
    - cron: "17 10 * * *"
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      no_upload:
        description: "Nur erzeugen, nicht hochladen (zum Testen)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-short
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg und Schriften installieren
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-color-emoji fonts-inter libraqm0

      - run: pip install -r requirements.txt

      - name: Chromium für die animierten Formate installieren
        run: python -m playwright install --with-deps chromium

      - name: Short erzeugen und hochladen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m shorts.main ${{ inputs.no_upload && '--no-upload' || '' }}

      - name: Video zum Hochladen bereitlegen (GitHub-Release)
        if: hashFiles('build/release/tag.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$(cat build/release/tag.txt)" build/release/short.mp4 \
            --title "$(cat build/release/title.txt)" --notes-file build/release/notes.md

      - name: Video als Artefakt speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: |
            build/2*/short.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Verlauf speichern
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Verlauf aktualisieren"
          git pull --rebase
          git push
